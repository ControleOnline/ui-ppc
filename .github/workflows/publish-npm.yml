name: Publish Package to npmjs

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.repository_owner == 'ControleOnline'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate release tag and provenance repository
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: |
          node <<'NODE'
          const pkg = require('./package.json');
          const expectedUrl = `https://github.com/${process.env.EXPECTED_REPOSITORY}`;
          if (process.env.RELEASE_TAG !== `v${pkg.version}`) {
            throw new Error(`Tag ${process.env.RELEASE_TAG} does not match package version ${pkg.version}`);
          }
          if (pkg.repository?.url !== expectedUrl) {
            throw new Error(`package.json repository.url must be ${expectedUrl}; got ${pkg.repository?.url}`);
          }
          NODE
      - name: Ensure npm 11.5.1+ (OIDC support)
        run: |
          npm install --global npm@latest
          npm --version
      - name: Publish to npmjs with trusted publishing
        run: npm publish --access public --loglevel verbose
